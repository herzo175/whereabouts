[project]
name = "whereabouts-agent"
version = "0.1.0"
description = "Pydantic AI case generator for Whereabouts"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-ai-slim[duckduckgo,openrouter,web-fetch]>=1.107,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["whereabouts_agent/tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whereabouts_agent"]
