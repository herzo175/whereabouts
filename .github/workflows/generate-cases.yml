name: Generate and publish daily case

on:
  schedule:
    # GitHub Actions cron is UTC. Run at both possible UTC midnight-Eastern
    # offsets, then let the guard below select the actual midnight run.
    - cron: '0 4,5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check for midnight Eastern
        id: schedule
        run: |
          if [ "$(TZ=America/New_York date +%H)" = "00" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        name: Install dependencies
        run: pnpm install --frozen-lockfile
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        name: Calculate the Eastern publication date
        id: dates
        run: echo "start=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        name: Allocate the next immutable revision
        id: revision
        env:
          START_DATE: ${{ steps.dates.outputs.start }}
        run: |
          case_dir="packages/case-content/content/cases/${START_DATE}"
          highest=0
          if [ -d "$case_dir" ]; then
            for path in "$case_dir"/v*.json; do
              [ -e "$path" ] || continue
              name=${path##*/}
              if [[ "$name" =~ ^v([1-9][0-9]*)\.json$ ]] && (( BASH_REMATCH[1] > highest )); then
                highest=${BASH_REMATCH[1]}
              fi
            done
          fi
          revision=$((highest + 1))
          echo "value=${revision}" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        name: Generate one upcoming case
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.openrouter_api_key }}
          WIKIMEDIA_USER_AGENT: ${{ secrets.WIKIMEDIA_USER_AGENT || 'Whereabouts/1.0 (https://github.com/herzo175/whereabouts)' }}
          WHEREABOUTS_MODEL: ${{ vars.WHEREABOUTS_MODEL || vars.whereabouts_model || 'openai/gpt-5.6-luna' }}
        run: pnpm content:generate-range -- --from "${{ steps.dates.outputs.start }}" --days 1 --revision "${{ steps.revision.outputs.value }}"
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        name: Validate generated content
        run: pnpm content:validate
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        name: Publish today's generated revision
        env:
          DATE: ${{ steps.dates.outputs.start }}
          REVISION: ${{ steps.revision.outputs.value }}
        run: |
          node <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const { DATE: date, REVISION: revisionText } = process.env;
          const revision = Number(revisionText);
          if (!/^\d{4}-\d{2}-\d{2}$/.test(date))
            throw new Error(`Invalid Eastern publication date: ${date}`);
          if (!Number.isInteger(revision) || revision < 1)
            throw new Error(`Invalid revision: ${revisionText}`);

          const manifestPath = 'packages/case-content/content/manifest.json';
          const artifactPath = `packages/case-content/content/cases/${date}/v${revision}.json`;
          const manifest = JSON.parse(await readFile(manifestPath, 'utf8'));
          const artifact = JSON.parse(await readFile(artifactPath, 'utf8'));
          if (
            artifact.publicationDate !== date ||
            artifact.revision !== revision ||
            !Number.isInteger(artifact.caseNumber) ||
            artifact.caseNumber < 1
          ) {
            throw new Error(`Invalid publication metadata in ${artifactPath}`);
          }
          manifest.cases ??= {};
          manifest.cases[date] = {
            caseNumber: artifact.caseNumber,
            revision,
            file: `./cases/${date}/v${revision}.json`,
          };
          await writeFile(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        name: Validate today's publication boundary
        env:
          PUBLICATION_CEILING: ${{ steps.dates.outputs.start }}
        run: pnpm content:validate
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        name: Commit the generated case
        env:
          START_DATE: ${{ steps.dates.outputs.start }}
          REVISION: ${{ steps.revision.outputs.value }}
        run: |
          git add packages/case-content/content/cases packages/case-content/content/manifest.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: add upcoming Whereabouts case ${START_DATE} v${REVISION}"
          git push origin main
