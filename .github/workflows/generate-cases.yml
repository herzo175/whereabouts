name: Generate case buffer

on:
  schedule:
    # GitHub Actions cron is UTC. Run at both possible UTC midnight-Eastern
    # offsets, then let the guard below select the actual midnight run.
    - cron: '0 4,5 * * *'
  workflow_dispatch:
    inputs:
      theme:
        description: Optional theme direction for the generated case
        required: false
        type: string
      date:
        description: Publication date (YYYY-MM-DD); defaults to seven days from now
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generated-case-buffer
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check for midnight Eastern
        id: schedule
        run: |
          if [ "$(TZ=America/New_York date +%H)" = "00" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        name: Install dependencies
        run: pnpm install --frozen-lockfile
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        name: Calculate and validate Eastern publication dates
        id: dates
        env:
          REQUESTED_DATE: ${{ inputs.date || '' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            START_DATE="${REQUESTED_DATE:-$(TZ=America/New_York date -d '+7 days' +%F)}"
            DAYS=1
          else
            START_DATE="$(TZ=America/New_York date +%F)"
            DAYS=10
          fi
          if [[ ! "$START_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid Eastern publication date: $START_DATE" >&2
            exit 1
          fi
          if [ "$(date -d "$START_DATE" +%F)" != "$START_DATE" ]; then
            echo "Non-canonical Eastern publication date: $START_DATE" >&2
            exit 1
          fi
          END_DATE="$(date -d "$START_DATE + $((DAYS - 1)) days" +%F)"
          if [[ ! "$END_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid publication ceiling: $END_DATE" >&2
            exit 1
          fi
          if [ "$(date -d "$END_DATE" +%F)" != "$END_DATE" ]; then
            echo "Non-canonical publication ceiling: $END_DATE" >&2
            exit 1
          fi
          LATEST_DATE="$(jq -r '.cases | keys | max // empty' packages/case-content/content/manifest.json)"
          if [ -n "$LATEST_DATE" ] && [[ ! "$LATEST_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid latest manifest date: $LATEST_DATE" >&2
            exit 1
          fi
          PUBLICATION_CEILING="$END_DATE"
          if [ -n "$LATEST_DATE" ] && [[ "$LATEST_DATE" > "$PUBLICATION_CEILING" ]]; then
            PUBLICATION_CEILING="$LATEST_DATE"
          fi
          echo "start=$START_DATE" >> "$GITHUB_OUTPUT"
          echo "end=$END_DATE" >> "$GITHUB_OUTPUT"
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"
          echo "ceiling=$PUBLICATION_CEILING" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        name: Create generated-content branch
        env:
          CONTENT_BRANCH: content/generated-buffer-${{ github.run_id }}
        run: |
          if [[ -z "$CONTENT_BRANCH" || ! "$CONTENT_BRANCH" =~ ^content/generated-buffer-[1-9][0-9]*$ ]]; then
            echo "Invalid generated-content branch: $CONTENT_BRANCH" >&2
            exit 1
          fi
          git switch --create "$CONTENT_BRANCH" origin/main
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        name: Generate requested case or maintain buffer
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.openrouter_api_key }}
          WIKIMEDIA_USER_AGENT: ${{ secrets.WIKIMEDIA_USER_AGENT || 'Whereabouts/1.0 (https://github.com/herzo175/whereabouts)' }}
          WHEREABOUTS_MODEL: ${{ vars.WHEREABOUTS_MODEL || vars.whereabouts_model || 'openai/gpt-5.6-luna' }}
          START_DATE: ${{ steps.dates.outputs.start }}
          DAYS: ${{ steps.dates.outputs.days }}
          THEME: ${{ inputs.theme || '' }}
        run: |
          ARGS=(--from "$START_DATE" --days "$DAYS")
          if [ -n "$THEME" ]; then
            ARGS+=(--theme "$THEME")
          fi
          pnpm content:prepare-buffer -- "${ARGS[@]}"
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        name: Format generated case content
        run: pnpm exec biome format --write packages/case-content/content
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        name: Validate generated publication buffer
        env:
          PUBLICATION_CEILING: ${{ steps.dates.outputs.ceiling }}
        run: |
          if [[ -z "$PUBLICATION_CEILING" || ! "$PUBLICATION_CEILING" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid publication ceiling: $PUBLICATION_CEILING" >&2
            exit 1
          fi
          pnpm content:validate
          pnpm quality
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        name: Commit and publish generated buffer pull request
        env:
          CONTENT_BRANCH: content/generated-buffer-${{ github.run_id }}
          START_DATE: ${{ steps.dates.outputs.start }}
          END_DATE: ${{ steps.dates.outputs.end }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$CONTENT_BRANCH" || ! "$CONTENT_BRANCH" =~ ^content/generated-buffer-[1-9][0-9]*$ ]]; then
            echo "Invalid generated-content branch: $CONTENT_BRANCH" >&2
            exit 1
          fi
          if [[ -z "$START_DATE" || ! "$START_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid start date: $START_DATE" >&2
            exit 1
          fi
          if [[ -z "$END_DATE" || ! "$END_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid end date: $END_DATE" >&2
            exit 1
          fi
          git add packages/case-content/content/cases packages/case-content/content/manifest.json packages/case-content/content/reviews
          if git diff --cached --quiet; then
            echo "Generated buffer is already current; no pull request needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: generate case buffer ${START_DATE} through ${END_DATE}"
          git push --set-upstream origin "$CONTENT_BRANCH"
          PR_URL="$(gh pr create --base main --head "$CONTENT_BRANCH" --title "content: generate case buffer ${START_DATE} through ${END_DATE}" --body-file packages/case-content/content/reviews/index.md)"
          if [[ -z "$PR_URL" || ! "$PR_URL" =~ ^https://github\.com/.+/pull/[1-9][0-9]*$ ]]; then
            echo "Invalid pull request URL: $PR_URL" >&2
            exit 1
          fi
          gh pr merge --auto --squash "$PR_URL"
