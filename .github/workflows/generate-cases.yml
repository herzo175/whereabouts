name: Generate upcoming cases

on:
  schedule:
    # GitHub Actions cron is UTC. Run at both possible UTC midnight-Eastern
    # offsets, then let the guard below select the actual midnight run.
    - cron: '0 4,5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check for midnight Eastern
        id: schedule
        run: |
          if [ "$(TZ=America/New_York date +%H)" = "00" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        name: Install dependencies
        run: pnpm install --frozen-lockfile
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        name: Calculate the upcoming range
        id: dates
        run: echo "start=$(TZ=America/New_York date -d '+14 days' +%F)" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        name: Generate one upcoming case
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.openrouter_api_key }}
          WIKIMEDIA_USER_AGENT: ${{ secrets.WIKIMEDIA_USER_AGENT || 'Whereabouts/1.0 (https://github.com/herzo175/whereabouts)' }}
          WHEREABOUTS_MODEL: ${{ vars.WHEREABOUTS_MODEL || vars.whereabouts_model || 'openai/gpt-5.6-luna' }}
        run: pnpm content:generate-range -- --from "${{ steps.dates.outputs.start }}" --days 1
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        name: Validate generated content
        run: pnpm content:validate
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        name: Produce human review packets
        run: pnpm content:review-range -- --from "${{ steps.dates.outputs.start }}" --days 1 --out artifacts/review
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        name: Upload review packets
        uses: actions/upload-artifact@v4
        with:
          name: whereabouts-review-${{ steps.dates.outputs.start }}
          path: artifacts/review
          if-no-files-found: error
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        name: Create the review pull request
        env:
          GH_TOKEN: ${{ github.token }}
          START_DATE: ${{ steps.dates.outputs.start }}
        run: |
          branch="content/upcoming-${START_DATE}"
          git switch -C "$branch"
          git add packages/case-content/content/cases
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: add upcoming Whereabouts cases"
          git push --force-with-lease --set-upstream origin "$branch"
          gh pr view "$branch" --json url >/dev/null 2>&1 || gh pr create --base main --head "$branch" --title "content: add upcoming Whereabouts cases" --body "Generated cases from ${START_DATE}; review the uploaded packets before merging."
