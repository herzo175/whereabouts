name: Publish reviewed case

on:
  schedule:
    # GitHub Actions cron is UTC; the guard below handles Eastern daylight time.
    - cron: '5 4,5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check for midnight Eastern
        id: schedule
        run: |
          if [ "$(TZ=America/New_York date +%H)" = "00" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        name: Install dependencies
        run: pnpm install --frozen-lockfile
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        name: Calculate the Eastern publication date
        id: date
        run: echo "value=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true'
        name: Add today's newest generated artifact to the manifest
        id: publish
        env:
          DATE: ${{ steps.date.outputs.value }}
        run: |
          node <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const date = process.env.DATE;
          if (!/^\d{4}-\d{2}-\d{2}$/.test(date))
            throw new Error(`Invalid Eastern publication date: ${date}`);
          const manifestPath = 'packages/case-content/content/manifest.json';
          const caseDirectory = `packages/case-content/content/cases/${date}`;
          const manifest = JSON.parse(await readFile(manifestPath, 'utf8'));
          if (manifest.cases?.[date]) {
            console.log(`${date} is already published.`);
            await writeFile(process.env.GITHUB_OUTPUT, 'publish=false\n');
            process.exit(0);
          }
          let artifactPath;
          try {
            const { readdir } = await import('node:fs/promises');
            const revisions = (await readdir(caseDirectory))
              .map((name) => /^v([1-9]\d*)\.json$/.exec(name))
              .filter(Boolean)
              .map((match) => Number(match[1]));
            const revision = Math.max(...revisions);
            if (!Number.isFinite(revision)) throw new Error('No generated revisions found');
            artifactPath = `${caseDirectory}/v${revision}.json`;
          } catch (error) {
            if (error?.code === 'ENOENT') {
              console.log(`No generated artifact exists for ${date}.`);
              await writeFile(process.env.GITHUB_OUTPUT, 'publish=false\n');
              process.exit(0);
            }
            throw error;
          }
          const artifact = JSON.parse(await readFile(artifactPath, 'utf8'));
          if (
            artifact.publicationDate !== date ||
            !Number.isInteger(artifact.revision) || artifact.revision < 1 ||
            !Number.isInteger(artifact.caseNumber) || artifact.caseNumber < 1
          ) {
            throw new Error(`Invalid publication metadata in ${artifactPath}`);
          }
          manifest.cases ??= {};
          manifest.cases[date] = {
            caseNumber: artifact.caseNumber,
            revision: artifact.revision,
            file: `./cases/${date}/v${artifact.revision}.json`,
          };
          await writeFile(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          await writeFile(process.env.GITHUB_OUTPUT, 'publish=true\n');
          NODE
      - if: steps.publish.outputs.publish == 'true'
        name: Validate the publication boundary
        env:
          PUBLICATION_CEILING: ${{ steps.date.outputs.value }}
        run: pnpm content:validate
      - if: steps.publish.outputs.publish == 'true'
        name: Commit the manifest entry
        env:
          DATE: ${{ steps.date.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/case-content/content/manifest.json
          git commit -m "content: publish Whereabouts case ${DATE}"
          git push origin main
